services:
  # Backend FastAPI Web Service
  - type: web
    name: vibemeter-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: HR_PASSWORD
        sync: false
      - key: ENGAGEMENT_CSV_PATH
        value: data/engagement_results.csv

  # Frontend React Static Site
  - type: web
    name: vibemeter-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: vibemeter-backend
          property: host